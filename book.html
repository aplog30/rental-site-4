<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Your Stay</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
    <h1 class="site-title">California Dream</h1>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="book.html" class="active">Book</a></li>
            <li><a href="amenities.html">Amenities</a></li>
            <li><a href="guide.html">User Guide</a></li>
            <li><a href="gallery.html">Photo Gallery</a></li>
        </ul>
    </nav>
</header>

<!-- MAIN CONTENT -->
<div class="booking-container">

    <h2>Availability Calendar</h2>

    <!-- Loading spinner -->
    <div id="calendar-loading" class="loading-spinner">
        Loading calendar...
    </div>

    <!-- Calendar -->
    <div id="calendar"></div>

    <!-- Price Box -->
    <div class="price-box">
        <p><strong>Selected Range:</strong> 
            <span id="rangeDisplay">None</span>
        </p>
        <p><strong>Total Price:</strong> 
            $<span id="priceDisplay">0</span>
        </p>
    </div>

    <!-- Booking Form -->
    <div class="booking-form">
        <h3>Request to Book</h3>

        <label>Email:</label>
        <input type="email" id="emailInput" placeholder="your@email.com">

        <label>Start Date:</label>
        <input type="text" id="startInput" readonly>

        <label>End Date:</label>
        <input type="text" id="endInput" readonly>

        <button id="submitRequest">Send Booking Request</button>
    </div>

</div><!-- end booking-container -->

<!-- JS FILE -->
<script src="calendar.js"></script>

</body>
</html>
