<div class="booking-container">

  <h2>Select Dates</h2>
  <div id="calendar"></div>

  <div class="price-box">
    <p><strong>Selected Range:</strong> <span id="rangeDisplay">None</span></p>
    <p><strong>Total Price:</strong> $<span id="priceDisplay">0</span></p>
  </div>

  <div class="booking-form">
    <h3>Request to Book</h3>

    <label>Email:</label>
    <input type="email" id="emailInput" placeholder="your@email.com">

    <label>Start Date:</label>
    <input type="text" id="startInput" readonly>

    <label>End Date:</label>
    <input type="text" id="endInput" readonly>

    <button id="submitRequest">Send Booking Request</button>
  </div>
</div>
