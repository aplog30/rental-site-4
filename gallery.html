<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery - California Dream</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <h1 class="site-title">California Dream</h1>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="book.html">Book</a></li>
                <li><a href="amenities.html">Amenities</a></li>
                <li><a href="guide.html">User Guide</a></li>
                <li><a href="gallery.html" class="active">Photo Gallery</a></li>
            </ul>
        </nav>
    </header>

    <main class="content">
        <h2>Guest Photo Gallery</h2>
        <p class="intro" style="text-align:center;">
            Memories from real stays at California Dream 🌴✨  
            Click any photo to enlarge.
        </p>

        <!-- Masonry Grid -->
        <div id="gallery" class="masonry"></div>

        <!-- Infinite scroll sentinel -->
        <div id="sentinel" class="sentinel">Loading more photos…</div>
    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox hidden">
        <span id="lightboxClose" class="lightbox-close">&times;</span>
        <img id="lightboxImg" class="lightbox-img" src="" alt="Expanded photo">
        <div id="lightboxCaption" class="lightbox-caption"></div>

        <button id="prevBtn" class="lightbox-nav prev">&#10094;</button>
        <button id="nextBtn" class="lightbox-nav next">&#10095;</button>
    </div>

    <script src="gallery.js"></script>
</body>
</html>
